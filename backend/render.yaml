services:
  - type: web
    name: flowgenie-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: LLM_MODEL
        value: agnes-2.0-flash
      - key: FRONTEND_URL
        value: https://flowgenie.vercel.app
