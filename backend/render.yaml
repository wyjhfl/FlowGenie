services:
  - type: web
    name: flowgenie-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://flowgenie.vercel.app
