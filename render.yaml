services:
  - type: web
    name: flowgenie-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # ===== LLM(必填,在 Render 控制台填真实值)=====
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      - key: LLM_MODEL
        value: agnes-2.0-flash
      - key: LLM_AVAILABLE_MODELS
        value: agnes-2.0-flash,agnes-2.0-pro,gpt-4o,claude-3-5-sonnet
      - key: LLM_TIMEOUT
        value: "120"
      # ===== 前端域名(CORS 白名单)=====
      - key: FRONTEND_URL
        value: https://flowgenie.hfl.asia
      # ===== 性能调优 =====
      - key: TOOL_TIMEOUT
        value: "120"
      - key: WORKFLOW_MAX_CONCURRENT
        value: "5"
      # ===== 日志 =====
      - key: LOG_FORMAT_JSON
        value: "1"
      # ===== 安全(初赛 Demo 留空放行,复赛再启用)=====
      - key: FLOWGENIE_API_KEY
        sync: false
      - key: FLOWGENIE_ADMIN_TOKEN
        sync: false
